<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7efdc">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131b27">
    <title>Wempo's Forum</title>
    <script>
      // No-flash pin: a manually stored choice (either direction) is applied
      // before paint; the OS-only case is handled by the prefers-color-scheme
      // rules in styles.css.
      let storedTheme = null;
      try {
        storedTheme = localStorage.getItem("forum-theme");
      } catch (error) {
        // Storage unavailable: the stylesheet's OS preference handles the look.
      }
      if (storedTheme === "dark" || storedTheme === "light") {
        document.documentElement.dataset.theme = storedTheme;
      }
    </script>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" data-app-link aria-label="Wempo's Forum home">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span>Wempo's Forum</span>
        </a>
        <search class="header-search">
          <form id="site-search" data-form="site-search" action="/" method="get">
            <label class="visually-hidden" for="search-query">Search posts and people</label>
            <input id="search-query" type="search" name="q" maxlength="100" placeholder="Search posts or people">
            <button class="button button-secondary icon-button" type="submit" aria-label="Search">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/><path d="M21 21l-4.35-4.35"/>
              </svg>
            </button>
          </form>
        </search>
        <button id="theme-toggle" class="button button-secondary icon-button" type="button" aria-label="Switch to dark theme"></button>
        <nav class="account-nav" aria-label="Site and account navigation" id="account-actions"></nav>
      </div>
    </header>
    <div class="status-bar">
      <p id="status-message" role="status" aria-live="polite"></p>
      <p id="error-message" role="alert" aria-live="assertive"></p>
    </div>
    <main id="main-content" class="main-content" tabindex="-1">
      <h1 class="visually-hidden">Wempo's Forum</h1>
      <p>Getting the forum ready…</p>
    </main>
    <footer class="site-footer">
      <p>Made by ItsWempo. Be chill, be kind, and have fun :3 <span id="version-tag"></span></p>
    </footer>
    <dialog id="report-dialog" aria-labelledby="report-title">
      <form data-form="report">
        <h2 id="report-title">Report this post</h2>
        <p>Tell moderators what needs their attention.</p>
        <label for="report-reason">Reason</label>
        <textarea id="report-reason" name="reason" rows="4" maxlength="500" required></textarea>
        <div class="form-actions">
          <button class="button button-secondary" type="button" data-action="close-report">Cancel</button>
          <button class="button button-danger" type="submit">Send report</button>
        </div>
      </form>
    </dialog>
    <!-- Click-to-expand attachments (micro-batch): a chrome-free native dialog
         that app.js fills with the same uncapped attachment URL. Escape and a
         click on the dialog or backdrop close it. -->
    <dialog id="attachment-lightbox" class="attachment-lightbox" aria-label="Full image view">
      <img id="attachment-lightbox-image" alt="">
    </dialog>
    <!-- Destructive-action confirmation (v2.4.1 feature): one shared dialog
         for post and account deletion. app.js fills the title and message from
         the pending action (textContent only), and the confirm button runs the
         matching handler; Escape and Cancel close without acting. -->
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="form-actions">
        <button class="button button-secondary" type="button" data-action="confirm-cancel">Cancel</button>
        <button class="button button-danger" id="confirm-ok" type="button" data-action="confirm-ok">Delete</button>
      </div>
    </dialog>
    <noscript><p class="noscript-note">This forum needs JavaScript to load posts and account actions.</p></noscript>
  </body>
</html>
