# Gitleaks configuration for Wempo's Forum (AGPL-3.0-or-later).
# Extends the upstream default ruleset; only exact, PUBLIC, fake test-fixture
# values are allowlisted here. Never add a real credential pattern to this file.
title = "Wempo's Forum gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Fake test fixtures (public by design, never real credentials)"
regexTarget = "secret"
regexes = [
  # RFC 6238 Appendix B TOTP seed ("12345678901234567890" in base32).
  '''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''',
  # Placeholder PASSWORD_PEPPER used only by tests/totp-routes.test.mjs.
  '''^0123456789abcdef0123456789abcdef$''',
  # Placeholder password in tests/worker.test.mjs.
  '''^fixture-phrase-27$''',
  # Placeholder pending TOTP secret in tests/wave524-security-pins.test.mjs
  # (proves Download my data never exports it).
  '''^PENDINGSECRETPENDINGSECRET234567$''',
  # Public Ahrefs Web Analytics site key (meant to sit in page HTML; owner
  # added then removed it in Nov 2026 — still present in history).
  '''^a7DvNBy\+d6CecJsDmHc5CA$''',
  # Placeholder ALTCHA_HMAC_KEY passed to makeEnv() in
  # tests/self-hosting.test.mjs (never a deployed key).
  '''^owner-key-0123456789abcdef0123456789$''',
]

# Owner-approved 2026-11-22 18:24: the vendored, unmodified Mermaid release
# (sha256-pinned by tests/batch-c-rendering.test.mjs) trips generic-api-key on
# minified identifiers such as `m.keyCount,…`. Exactly one file, nothing else.
[[allowlists]]
description = "Verbatim Mermaid vendor bundle (minified identifiers, not credentials)"
paths = [
  '''^public/js/vendor/mermaid\.min\.js$''',
]
