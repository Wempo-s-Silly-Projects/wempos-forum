# SPDX-FileCopyrightText: 2026 ItsWempo
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE 3.3 (https://reuse.software/spec-3.3/): licensing for the files that
# cannot carry a comment header (JSON, images, the lockfile, config files),
# plus the documentation. Every .js/.mjs/.css file carries its own SPDX lines
# and is pinned by tests/license-headers.test.mjs. Check with `reuse lint`.
version = 1

[[annotations]]
path = [
  "public/locales/**",
  "public/icons/**",
  "public/og-image.svg",
  "public/og-image.png",
  "public/index.html",
  "public/.well-known/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "wrangler.toml",
  "wrangler.example.toml",
  ".dev.vars.example",
  ".gitignore",
  ".gitleaks.toml",
  ".mcp.json",
  ".bestpractices.json",
  ".semgrepignore",
  ".github/**",
  "config/**",
  "scripts/*.sh",
  "scripts/*.plist",
  "apply-remote.sh",
  "migrations/**",
  "docs/**",
  "*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The code of conduct is adapted from the Contributor Covenant 3.0, which is
# licensed under CC BY-SA 4.0 (see its Attribution section).
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["Organization for Ethical Source", "2026 ItsWempo"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Vendored files, kept byte-for-byte and never edited (AGENTS.md). Their
# banner names the upstream "Project Designer — experience/*" module, which
# was itself extracted from this forum's own api/core code by its author, so
# the upstream license is this project's license. REUSE.toml annotates them
# here instead of a header so the files themselves stay untouched.
[[annotations]]
path = "api/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Prism 1.30.0 (https://prismjs.com/), downloaded build with every language
# and 16 plugins, kept byte-for-byte as public/js/vendor/prism.js with no
# added banner (slate 2026-11-22-d). Prism is MIT-licensed, which is
# compatible with AGPL-3.0-or-later; the sha256 is pinned by
# tests/wave574-prism.test.mjs.
[[annotations]]
path = "public/js/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "Lea Verou and PrismJS contributors"
SPDX-License-Identifier = "MIT"

# Batch J (navigation, keyboard and reading polish): browser libraries
# vendored byte-for-byte from their published package tarballs, each
# MIT-licensed (compatible with AGPL-3.0-or-later). These later blocks
# override the Prism block above for their own files; the sha256 of each is
# pinned by tests/wave-batch-j-nav.test.mjs.
[[annotations]]
path = "public/js/vendor/tinykeys.js"
precedence = "override"
SPDX-FileCopyrightText = "2020 Jamie Kyle"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "public/js/vendor/nprogress.js"
precedence = "override"
SPDX-FileCopyrightText = "2013-2014 Rico Sta. Cruz"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "public/js/vendor/floating-ui.core.umd.min.js"
precedence = "override"
SPDX-FileCopyrightText = "2021-present Floating UI contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "public/js/vendor/floating-ui.dom.umd.min.js"
precedence = "override"
SPDX-FileCopyrightText = "2021-present Floating UI contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "public/js/vendor/auto-animate.js"
precedence = "override"
SPDX-FileCopyrightText = "2022 FormKit Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "public/js/vendor/tablesort.min.js"
precedence = "override"
SPDX-FileCopyrightText = "Tristen Brown"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "public/js/vendor/tablesort.number.min.js"
precedence = "override"
SPDX-FileCopyrightText = "Tristen Brown"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "public/js/vendor/countUp.js"
precedence = "override"
SPDX-FileCopyrightText = "Jamie Perkins"
SPDX-License-Identifier = "MIT"

[[annotations]]
