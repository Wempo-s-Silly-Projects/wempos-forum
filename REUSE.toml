# SPDX-FileCopyrightText: 2026 ItsWempo
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE 3.3 (https://reuse.software/spec-3.3/): licensing for the files that
# cannot carry a comment header (JSON, images, the lockfile, config files),
# plus the documentation. Every .js/.mjs/.css file carries its own SPDX lines
# and is pinned by tests/license-headers.test.mjs. Check with `reuse lint`.
version = 1

[[annotations]]
path = [
  "public/locales/**",
  "public/icons/**",
  "public/og-image.svg",
  "public/og-image.png",
  "public/index.html",
  "public/.well-known/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "wrangler.toml",
  "wrangler.example.toml",
  ".dev.vars.example",
  ".gitignore",
  ".gitleaks.toml",
  ".mcp.json",
  ".bestpractices.json",
  ".semgrepignore",
  ".github/**",
  "config/**",
  "scripts/*.sh",
  "scripts/*.plist",
  "apply-remote.sh",
  "migrations/**",
  "docs/**",
  "*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The code of conduct is adapted from the Contributor Covenant 3.0, which is
# licensed under CC BY-SA 4.0 (see its Attribution section).
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["Organization for Ethical Source", "2026 ItsWempo"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Vendored files, kept byte-for-byte and never edited (AGENTS.md). Their
# banner names the upstream "Project Designer — experience/*" module, which
# was itself extracted from this forum's own api/core code by its author, so
# the upstream license is this project's license. REUSE.toml annotates them
# here instead of a header so the files themselves stay untouched.
[[annotations]]
path = "api/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Prism 1.30.0 (https://prismjs.com/), downloaded build with every language
# and 16 plugins, kept byte-for-byte as public/js/vendor/prism.js with no
# added banner (slate 2026-11-22-d). Prism is MIT-licensed, which is
# compatible with AGPL-3.0-or-later; the sha256 is pinned by
# tests/wave574-prism.test.mjs.
[[annotations]]
path = "public/js/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "Lea Verou and PrismJS contributors"
SPDX-License-Identifier = "MIT"

# Embeds and media players (wave 5.76, Batch D): upstream builds kept byte for
# byte under public/js/vendor/ (sha256 pinned by tests/wave576-embeds.test.mjs).
# Each later annotation overrides the folder-wide Prism one above for its own
# file. All four licences are compatible with AGPL-3.0-or-later.
# hls.js 1.7.4 (light ESM build), Apache-2.0.
[[annotations]]
path = "public/js/vendor/hls.light.min.mjs"
precedence = "override"
SPDX-FileCopyrightText = "2017 Dailymotion and hls.js contributors"
SPDX-License-Identifier = "Apache-2.0"

# Plyr 3.8.5 (ESM build, its stylesheet and icon sprite), MIT.
[[annotations]]
path = ["public/js/vendor/plyr.min.mjs", "public/js/vendor/plyr.css", "public/js/vendor/plyr.svg"]
precedence = "override"
SPDX-FileCopyrightText = "2017 Sam Potts"
SPDX-License-Identifier = "MIT"

# WaveSurfer.js 8.1.0 (ESM build), BSD-3-Clause.
[[annotations]]
path = "public/js/vendor/wavesurfer.esm.js"
precedence = "override"
SPDX-FileCopyrightText = "2012-2023 katspaugh and contributors"
SPDX-License-Identifier = "BSD-3-Clause"

# <model-viewer> 4.4.0 (minified bundle): Apache-2.0, bundling Lit
# (BSD-3-Clause), three.js and fflate (MIT).
[[annotations]]
path = "public/js/vendor/model-viewer.min.js"
precedence = "override"
SPDX-FileCopyrightText = ["2017-2026 Google LLC", "2010-2026 Three.js Authors", "2020 Arjun Barrett (fflate)"]
SPDX-License-Identifier = "Apache-2.0 AND BSD-3-Clause AND MIT"
