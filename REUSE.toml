# SPDX-FileCopyrightText: 2026 ItsWempo
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE 3.3 (https://reuse.software/spec-3.3/): licensing for the files that
# cannot carry a comment header (JSON, images, the lockfile, config files),
# plus the documentation. Every .js/.mjs/.css file carries its own SPDX lines
# and is pinned by tests/license-headers.test.mjs. Check with `reuse lint`.
version = 1

[[annotations]]
path = [
  "public/locales/**",
  "public/icons/**",
  "public/og-image.svg",
  "public/og-image.png",
  "public/index.html",
  "public/.well-known/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "wrangler.toml",
  "wrangler.example.toml",
  ".dev.vars.example",
  ".gitignore",
  ".gitleaks.toml",
  ".mcp.json",
  ".bestpractices.json",
  ".semgrepignore",
  ".github/**",
  "config/**",
  "scripts/*.sh",
  "scripts/*.plist",
  "apply-remote.sh",
  "migrations/**",
  "docs/**",
  "*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The code of conduct is adapted from the Contributor Covenant 3.0, which is
# licensed under CC BY-SA 4.0 (see its Attribution section).
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["Organization for Ethical Source", "2026 ItsWempo"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Vendored files, kept byte-for-byte and never edited (AGENTS.md). Their
# banner names the upstream "Project Designer — experience/*" module, which
# was itself extracted from this forum's own api/core code by its author, so
# the upstream license is this project's license. REUSE.toml annotates them
# here instead of a header so the files themselves stay untouched.
[[annotations]]
path = "api/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Prism 1.30.0 (https://prismjs.com/), downloaded build with every language
# and 16 plugins, kept byte-for-byte as public/js/vendor/prism.js with no
# added banner (slate 2026-11-22-d). Prism is MIT-licensed, which is
# compatible with AGPL-3.0-or-later; the sha256 is pinned by
# tests/wave574-prism.test.mjs.
[[annotations]]
path = "public/js/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "Lea Verou and PrismJS contributors"
SPDX-License-Identifier = "MIT"

# Batch C (post content rendering): more browser libraries vendored
# byte-for-byte under public/js/vendor/, each pinned by sha256 in
# tests/batch-c-rendering.test.mjs. These later, narrower annotations take
# precedence over the Prism block above for their own paths (REUSE: the last
# matching annotation wins). All licences are AGPL-3.0-or-later compatible.
# DOMPurify 3.5.0 (dual-licensed; Apache-2.0 and MPL-2.0 are both
# GPLv3-compatible).
[[annotations]]
path = "public/js/vendor/purify.min.js"
precedence = "override"
SPDX-FileCopyrightText = "Cure53 and other contributors"
SPDX-License-Identifier = "MPL-2.0 OR Apache-2.0"

# KaTeX 0.19.1: script, stylesheet and the woff2 fonts only.
[[annotations]]
path = "public/js/vendor/katex/**"
precedence = "override"
SPDX-FileCopyrightText = "2013-2020 Khan Academy and other contributors"
SPDX-License-Identifier = "MIT"

# Mermaid 12.3.0 (dist/mermaid.min.js).
[[annotations]]
path = "public/js/vendor/mermaid.min.js"
precedence = "override"
SPDX-FileCopyrightText = "2014-2022 Knut Sveidqvist"
SPDX-License-Identifier = "MIT"

# svg-pan-zoom 3.6.2 (dist/svg-pan-zoom.min.js).
[[annotations]]
path = "public/js/vendor/svg-pan-zoom.min.js"
precedence = "override"
SPDX-FileCopyrightText = "2009-2010 Andrea Leofreddi <a.leofreddi@vleo.net>"
SPDX-License-Identifier = "BSD-2-Clause"

# ansi_up 6.0.6 (ansi_up.js, an ES module with no imports).
[[annotations]]
path = "public/js/vendor/ansi_up.js"
precedence = "override"
SPDX-FileCopyrightText = "2011 github.com/drudru"
SPDX-License-Identifier = "MIT"

# json-formatter-js 2.5.23 (dist/json-formatter.umd.js).
[[annotations]]
path = "public/js/vendor/json-formatter.umd.js"
precedence = "override"
SPDX-FileCopyrightText = "2015 Mohsen Azimi"
SPDX-License-Identifier = "MIT"
