# SPDX-FileCopyrightText: 2026 ItsWempo
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE 3.3 (https://reuse.software/spec-3.3/): licensing for the files that
# cannot carry a comment header (JSON, images, the lockfile, config files),
# plus the documentation. Every .js/.mjs/.css file carries its own SPDX lines
# and is pinned by tests/license-headers.test.mjs. Check with `reuse lint`.
version = 1

[[annotations]]
path = [
  "public/locales/**",
  "public/icons/**",
  "public/og-image.svg",
  "public/og-image.png",
  "public/index.html",
  "public/.well-known/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "wrangler.toml",
  "wrangler.example.toml",
  ".dev.vars.example",
  ".gitignore",
  ".gitleaks.toml",
  ".mcp.json",
  ".bestpractices.json",
  ".semgrepignore",
  ".github/**",
  "config/**",
  "scripts/*.sh",
  "scripts/*.plist",
  "apply-remote.sh",
  "migrations/**",
  "docs/**",
  "*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The code of conduct is adapted from the Contributor Covenant 3.0, which is
# licensed under CC BY-SA 4.0 (see its Attribution section).
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["Organization for Ethical Source", "2026 ItsWempo"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Vendored files, kept byte-for-byte and never edited (AGENTS.md). Their
# banner names the upstream "Project Designer — experience/*" module, which
# was itself extracted from this forum's own api/core code by its author, so
# the upstream license is this project's license. REUSE.toml annotates them
# here instead of a header so the files themselves stay untouched.
[[annotations]]
path = "api/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Prism 1.30.0 (https://prismjs.com/), downloaded build with every language
# and 16 plugins, kept byte-for-byte as public/js/vendor/prism.js with no
# added banner (slate 2026-11-22-d). Prism is MIT-licensed, which is
# compatible with AGPL-3.0-or-later; the sha256 is pinned by
# tests/wave574-prism.test.mjs.
[[annotations]]
path = "public/js/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "Lea Verou and PrismJS contributors"
SPDX-License-Identifier = "MIT"

# Batch F (account security): browser libraries vendored byte-for-byte (no
# added banner; sha256 pins in tests/helpers/batchf-vendor-pins.mjs). These
# blocks come after the Prism block above, so for their paths they take
# precedence (REUSE: the last matching annotation wins). All licences are
# compatible with AGPL-3.0-or-later.

# qrcode-generator 2.0.4 (dist/qrcode.mjs), MIT.
[[annotations]]
path = "public/js/vendor/qrcode-generator/**"
precedence = "override"
SPDX-FileCopyrightText = "Kazuhiko Arase"
SPDX-License-Identifier = "MIT"

# @simplewebauthn/browser 14.0.0 (esm/**), MIT.
[[annotations]]
path = "public/js/vendor/simplewebauthn-browser/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 Matthew Miller"
SPDX-License-Identifier = "MIT"

# altcha-lib 2.10.0 (dist/esm/v1/index.js + helpers.js), MIT.
[[annotations]]
path = "public/js/vendor/altcha-lib/**"
precedence = "override"
SPDX-FileCopyrightText = "Daniel Regeci"
SPDX-License-Identifier = "MIT"

# zxcvbn-ts: @zxcvbn-ts/core 4.3.0, language-common 4.2.0, language-en 4.1.2
# (each package's dist/zxcvbn-ts.js), code MIT. Bundled dictionary data per
# the packages' NOTICE files: English common words derived from OpenSubtitles
# via OPUS (ODC-BY-1.0); the password list (public-domain dedication) and the
# EFF diceware list (CC BY 4.0 per EFF's site terms).
[[annotations]]
path = "public/js/vendor/zxcvbn-ts/**"
precedence = "override"
SPDX-FileCopyrightText = ["zxcvbn-ts contributors", "Electronic Frontier Foundation", "Helsinki-NLP / OPUS"]
SPDX-License-Identifier = "MIT AND ODC-By-1.0 AND CC-BY-4.0"

# The EFF large wordlist for random passphrases (7776 words), as packaged in
# eff-diceware-passphrase 3.0.0 (wordlist.json). EFF's site terms license its
# original material under CC BY 4.0.
[[annotations]]
path = "public/js/vendor/eff-wordlist/**"
precedence = "override"
SPDX-FileCopyrightText = "Electronic Frontier Foundation"
SPDX-License-Identifier = "CC-BY-4.0"
