# SPDX-FileCopyrightText: 2026 ItsWempo
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE 3.3 (https://reuse.software/spec-3.3/): licensing for the files that
# cannot carry a comment header (JSON, images, the lockfile, config files),
# plus the documentation. Every .js/.mjs/.css file carries its own SPDX lines
# and is pinned by tests/license-headers.test.mjs. Check with `reuse lint`.
version = 1

[[annotations]]
path = [
  "public/locales/**",
  "public/icons/**",
  "public/og-image.svg",
  "public/og-image.png",
  "public/index.html",
  "public/.well-known/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "wrangler.toml",
  "wrangler.example.toml",
  ".dev.vars.example",
  ".gitignore",
  ".gitleaks.toml",
  ".mcp.json",
  ".bestpractices.json",
  ".semgrepignore",
  ".github/**",
  "config/**",
  "scripts/*.sh",
  "scripts/*.plist",
  "apply-remote.sh",
  "migrations/**",
  "docs/**",
  "*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The code of conduct is adapted from the Contributor Covenant 3.0, which is
# licensed under CC BY-SA 4.0 (see its Attribution section).
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["Organization for Ethical Source", "2026 ItsWempo"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Vendored files, kept byte-for-byte and never edited (AGENTS.md). Their
# banner names the upstream "Project Designer — experience/*" module, which
# was itself extracted from this forum's own api/core code by its author, so
# the upstream license is this project's license. REUSE.toml annotates them
# here instead of a header so the files themselves stay untouched.
[[annotations]]
path = "api/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Prism 1.30.0 (https://prismjs.com/), downloaded build with every language
# and 16 plugins, kept byte-for-byte as public/js/vendor/prism.js with no
# added banner (slate 2026-11-22-d). Prism is MIT-licensed, which is
# compatible with AGPL-3.0-or-later; the sha256 is pinned by
# tests/wave574-prism.test.mjs.
[[annotations]]
path = "public/js/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "Lea Verou and PrismJS contributors"
SPDX-License-Identifier = "MIT"

# Batch L (reader safety) vendored libraries, each kept byte-for-byte with no
# added banner (sha256 pinned by tests/batchl-reader-safety.test.mjs). All
# are MIT, compatible with AGPL-3.0-or-later. These blocks come after the
# Prism catch-all above, so they override it for their own folders.
# tldts 7.5.5 (dist/index.esm.min.js): public-suffix-aware domain parsing.
[[annotations]]
path = "public/js/vendor/tldts/**"
precedence = "override"
SPDX-FileCopyrightText = "Rémi Berson"
SPDX-License-Identifier = "MIT"

# punycode.js 2.3.1 (punycode.es6.js): IDN host decoding.
[[annotations]]
path = "public/js/vendor/punycode/**"
precedence = "override"
SPDX-FileCopyrightText = "Mathias Bynens"
SPDX-License-Identifier = "MIT"

# bad-words-next 3.2.0 (lib/decode.mjs and the nine word lists only; the
# matcher is first-party in public/js/strong-language.js).
[[annotations]]
path = "public/js/vendor/bad-words-next/**"
precedence = "override"
SPDX-FileCopyrightText = "Void Resort"
SPDX-License-Identifier = "MIT"

# franc-min 6.2.0 (data.js trigram profiles and expressions.js script
# ranges; the scorer is first-party in public/js/lang-detect.js).
[[annotations]]
path = "public/js/vendor/franc-min/**"
precedence = "override"
SPDX-FileCopyrightText = "Titus Wormer"
SPDX-License-Identifier = "MIT"
