# SPDX-FileCopyrightText: 2026 ItsWempo
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# REUSE 3.3 (https://reuse.software/spec-3.3/): licensing for the files that
# cannot carry a comment header (JSON, images, the lockfile, config files),
# plus the documentation. Every .js/.mjs/.css file carries its own SPDX lines
# and is pinned by tests/license-headers.test.mjs. Check with `reuse lint`.
version = 1

[[annotations]]
path = [
  "public/locales/**",
  "public/icons/**",
  "public/og-image.svg",
  "public/og-image.png",
  "public/index.html",
  "public/.well-known/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "wrangler.toml",
  "wrangler.example.toml",
  ".dev.vars.example",
  ".gitignore",
  ".gitleaks.toml",
  ".mcp.json",
  ".bestpractices.json",
  ".semgrepignore",
  ".github/**",
  "config/**",
  "scripts/*.sh",
  "scripts/*.plist",
  "apply-remote.sh",
  "migrations/**",
  "docs/**",
  "*.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The code of conduct is adapted from the Contributor Covenant 3.0, which is
# licensed under CC BY-SA 4.0 (see its Attribution section).
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = ["Organization for Ethical Source", "2026 ItsWempo"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Vendored files, kept byte-for-byte and never edited (AGENTS.md). Their
# banner names the upstream "Project Designer — experience/*" module, which
# was itself extracted from this forum's own api/core code by its author, so
# the upstream license is this project's license. REUSE.toml annotates them
# here instead of a header so the files themselves stay untouched.
[[annotations]]
path = "api/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ItsWempo"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Prism 1.30.0 (https://prismjs.com/), downloaded build with every language
# and 16 plugins, kept byte-for-byte as public/js/vendor/prism.js with no
# added banner (slate 2026-11-22-d). Prism is MIT-licensed, which is
# compatible with AGPL-3.0-or-later; the sha256 is pinned by
# tests/wave574-prism.test.mjs.
[[annotations]]
path = "public/js/vendor/**"
precedence = "override"
SPDX-FileCopyrightText = "Lea Verou and PrismJS contributors"
SPDX-License-Identifier = "MIT"

# Batch H (composer and chat input): browser libraries kept byte-for-byte
# under public/js/vendor/ with no added banner, each MIT-licensed (compatible
# with AGPL-3.0-or-later; text in LICENSES/MIT.txt). These blocks come after
# the public/js/vendor/** glob above, so they take precedence for their
# files. sha256 pins live in tests/batch-h-composer-input.test.mjs.
# text-field-edit 4.1.1 (index.js): undo-preserving field edits.
[[annotations]]
path = "public/js/vendor/text-field-edit.js"
precedence = "override"
SPDX-FileCopyrightText = "Federico Brigante"
SPDX-License-Identifier = "MIT"

# turndown 7.2.5 (lib/turndown.browser.es.js): HTML to Markdown on paste.
[[annotations]]
path = "public/js/vendor/turndown.js"
precedence = "override"
SPDX-FileCopyrightText = "2017 Dom Christie"
SPDX-License-Identifier = "MIT"

# picmo 5.8.5 (dist/index.js, dist/index.css): the native-emoji picker.
[[annotations]]
path = ["public/js/vendor/picmo.js", "public/js/vendor/picmo.css"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Joe Attardi"
SPDX-License-Identifier = "MIT"

# fuzzysort 4.0.2 (fuzzysort.min.js): @mention ranking.
[[annotations]]
path = "public/js/vendor/fuzzysort.min.js"
precedence = "override"
SPDX-FileCopyrightText = "2018 Stephen Kamenar"
SPDX-License-Identifier = "MIT"

# split.js 1.6.5 (dist/split.es.js): the side-by-side composer preview.
[[annotations]]
path = "public/js/vendor/split.js"
precedence = "override"
SPDX-FileCopyrightText = "2020 Nathan Cahill"
SPDX-License-Identifier = "MIT"

# emojibase-data 18.0.0 (<locale>/data.json + messages.json for the locales
# the forum also speaks): the emoji picker's localized data and search.
[[annotations]]
path = "public/js/vendor/emojibase/**"
precedence = "override"
SPDX-FileCopyrightText = "2017-2019 Miles Johnson"
SPDX-License-Identifier = "MIT"
