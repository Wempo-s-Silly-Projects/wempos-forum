name: ZAP baseline (passive DAST)

# Passive scan only: the ZAP baseline spiders the live site for a short time
# and reports what passive rules see in the responses. No active attacks are
# sent. Never runs on push; weekly + manual only.
on:
  schedule:
    - cron: "41 7 * * 2" # weekly, Tuesday 07:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ZAP baseline scan of the live forum
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://wempos-forum.com
          # ghcr.io/zaproxy/zaproxy:stable pinned by digest (resolved 2026-11-21);
          # bump deliberately to pick up new ZAP passive rules.
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          allow_issue_writing: false # report goes to the workflow artifact only
          fail_action: false # informational until the first reports are triaged
          artifact_name: zap-baseline-report
