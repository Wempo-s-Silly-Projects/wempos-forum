name: ZAP baseline (passive DAST)

# Passive scan only: the ZAP baseline spiders the forum for a short time and
# reports what passive rules see in the responses. No active attacks are sent.
# Never runs on push; weekly + manual only.
#
# The target is a LOCAL copy of the forum started inside this job, not the
# live site: the live site sits behind Cloudflare, which answers automated
# scanners with its bot-challenge page, so the first live run (GitHub run
# 44958535048) scanned only that page and never reached the forum. The local
# copy runs the same worker code under `wrangler dev --local` on an empty
# local D1 database. See docs/security-tooling.md.
on:
  schedule:
    - cron: "41 7 * * 2" # weekly, Tuesday 07:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      FORUM_URL: http://localhost:8787
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Local-only settings, written at job runtime and never committed. The
      # pepper is a fixed, public test value (not a secret: this throwaway
      # database holds no real accounts). No ALTCHA_HMAC_KEY (and no legacy
      # TURNSTILE_SECRET to derive one from), so the human check is off for
      # the scan. SITE_ORIGIN points documents at the local copy.
      - name: Write local-only .dev.vars
        run: |
          printf '%s\n' \
            'PASSWORD_PEPPER=ci-only-not-a-secret-pepper' \
            "SITE_ORIGIN=${FORUM_URL}" > .dev.vars

      - name: Apply D1 migrations to the local database
        run: pnpm run db:migrate:local

      - name: Start the forum locally
        run: |
          nohup pnpm exec wrangler dev --local --port 8787 > "${RUNNER_TEMP}/wrangler-dev.log" 2>&1 &

      - name: Wait for /api/version
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${FORUM_URL}/api/version" || true)
            if [ "$status" = "200" ]; then
              echo "Forum is up after ${attempt} attempt(s)."
              curl -s "${FORUM_URL}/api/version"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The local forum did not answer /api/version with 200 within 120 seconds."
          cat "${RUNNER_TEMP}/wrangler-dev.log"
          exit 1

      # The action runs the ZAP container with --network="host", so the
      # scanner reaches the runner's localhost directly.
      - name: ZAP baseline scan of the local forum
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8787
          # ghcr.io/zaproxy/zaproxy:stable pinned by digest (resolved 2026-11-21);
          # bump deliberately to pick up new ZAP passive rules.
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          allow_issue_writing: false # report goes to the workflow artifact only
          fail_action: false # informational until the first reports are triaged
          artifact_name: zap-baseline-report

      - name: Show the local forum log
        if: always()
        run: cat "${RUNNER_TEMP}/wrangler-dev.log" || true
