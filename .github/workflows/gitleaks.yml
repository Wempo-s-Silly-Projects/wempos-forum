name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the official
  # gitleaks_8.30.1_checksums.txt release asset (github.com/gitleaks/gitleaks).
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          fetch-depth: 0 # full history: every commit is scanned
      - name: Install gitleaks (pinned release, checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan full git history
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 .
