name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: blacksmith-4vcpu-ubuntu-2604
    steps:
      - uses: useblacksmith/checkout@v1 # v4
      - name: Lint every tracked shell script
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version
          # Tracked *.sh files, plus tracked executables whose shebang names a POSIX shell.
          mapfile -t scripts < <(
            {
              git ls-files -z -- '*.sh' | tr '\0' '\n'
              git ls-files -s | awk '$1 == "100755" { print $4 }' | while IFS= read -r f; do
                head -n 1 -- "$f" | grep -Eq '^#!.*/(env )?(ba|da|k)?sh( |$)' && printf '%s\n' "$f"
              done
            } | grep -Ev '^(api/vendor|public/js/vendor|node_modules)/' | sort -u
          )
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts tracked."
            exit 0
          fi
          printf 'Checking: %s\n' "${scripts[@]}"
          shellcheck -- "${scripts[@]}"
