name: Test forum backend

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply schema to an isolated local D1 database
        run: npm run db:migrate:local
      - name: Run unit tests
        run: npm test
      - name: Check Worker and frontend syntax
        run: |
          node --check worker.mjs
          for file in public/js/*.js; do
            node --check "$file"
          done
      - name: Validate Cloudflare deployment configuration
        run: npx wrangler deploy --dry-run
