name: Gallery regression checks

on:
  pull_request:
  push:
    branches: [main, "fix/**", "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Supply-chain posture (review finding): lifecycle scripts stay OFF for
      # the install, then only the three packages package.json's allowScripts
      # list actually needs (esbuild, fsevents, workerd) get their scripts run
      # — a new compromised postinstall in any other dependency can't execute
      # in CI.
      - name: Install dependencies (scripts disabled)
        run: npm ci --ignore-scripts
      - name: Rebuild script-carrying dependencies (allowScripts list)
        run: npm rebuild --foreground-scripts esbuild fsevents workerd
      - name: Apply schema to an isolated local D1 database
        run: npm run db:migrate:local
      - name: Run Gallery regression tests
        run: node --test tests/gallery-migration.test.mjs
      - name: Check Worker and frontend syntax
        run: |
          node --check worker.mjs
          for file in public/js/*.js; do
            node --check "$file"
          done
      - name: Validate Cloudflare deployment configuration
        run: npx wrangler deploy --dry-run
