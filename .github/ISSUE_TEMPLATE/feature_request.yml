name: Feature request
description: Propose a new feature, improvement, or change to Wempo's Forum.
title: "[Feature]: "
labels:
  - kind:feature
  - status:needs-triage

body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Project Experience (Anything outside of public/ that is not repo docs or repo config)
        - Project Frontload (The frontend/actual site)
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this solve?
      placeholder: "It is currently difficult to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature you want to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative solutions? If so, why would you prefer your proposed solution?
    validations:
      required: false

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits?
      description: Who would benefit from this feature? Pick all that apply.
      multiple: true
      options:
        - Forumers
        - The devs (me and mh friend)
        - Guests
        - Admins
        - Contributors
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: Are you interested in implementing this?
      options:
        - Yes, I would like to contribute this feature.
        - No, I just want to suggest the idea.
        - I'm not sure / maybe in the future.
    validations:
      required: true
  
  - type: textarea
    id: extra_details
    attributes:
      label: Additional details
      description: Any other information, such as implementation details, related issues, or links to examples.
    validations:
      required: false
