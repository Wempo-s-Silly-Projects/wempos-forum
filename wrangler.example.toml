# Wempo's Forum — example Wrangler configuration for your own copy.
#
# Copy this file to wrangler.toml (git-ignored) and fill in the values marked
# CHANGE ME. Full steps: docs/self-hosting.md.
#
#   cp wrangler.example.toml wrangler.toml

# Your worker's name. Wempo Accounts' FORUM_WORKER service binding must name
# this same worker.
name = "wempos-forum"  # CHANGE ME if you like
main = "worker.mjs"
upload_source_maps = true
compatibility_date = "2026-10-13"
# The forum answers on <name>.<your-subdomain>.workers.dev. To use your own
# domain, add a custom domain in the Cloudflare dashboard (or a `routes` entry
# here) and set SITE_ORIGIN below to it.
workers_dev = true

# Smart Placement: lets Cloudflare run the worker near its D1 database when
# that is measurably faster than running it near the visitor. Remove the two
# lines below to always run nearest the visitor.
[placement]
mode = "smart"

[vars]
# The forum's public origin, e.g. "https://forum.example.org". When set, the
# workers.dev address 301s here and every sitemap/robots/MCP/OpenAPI link uses
# it. Leave it empty to serve everything on whatever address the request used
# (no redirect).
SITE_ORIGIN = ""
# Your Wempo Accounts origin, e.g. "https://accounts.example.org". Every Sign
# in / Sign out link targets it; sign-in does not work until it is set.
ACCOUNTS_ORIGIN = ""
# Optional human verification (self-hosted ALTCHA proof of work).
# Disabled by default. It runs only when the ALTCHA_HMAC_KEY secret is set
# (`pnpm exec wrangler secret put ALTCHA_HMAC_KEY`, 32+ random bytes).
# No third-party verification service is required.
# The slug this forum sends to Wempo Accounts when it redeems a sign-in ticket.
# Must match the site name your Accounts copy expects for this forum.
RELAY_WORKER_NAME = "wempos-forum"
# The share-preview image (og:image / twitter:image) link previews show for
# every page. Leave it empty to use the forum's own /og-image.png card (edit
# public/og-image.svg and re-export the PNG to rebrand it), or set a full
# http(s) image URL, e.g. "https://forum.example.org/my-card.png" (1200x630).
OG_IMAGE_URL = ""
# Where the footer's "Source code" link points (AGPL-3.0 section 13: people
# using your forum over the network must be offered its source). Leave it
# empty to link the upstream repository at the deployed commit. If you modify
# the forum, point this at YOUR source, e.g. "https://git.example.org/you/forum".
# Only https:// addresses are used; anything else falls back to the default.
SOURCE_URL = ""
# AutoMod (optional, OFF by default). The /api/automod/* surface answers 404
# unless this is exactly "true" AND the AUTOMOD_KEY secret is set — the key
# alone never turns it on. Uncomment to opt in; docs/admin-guide.md ("AutoMod
# API") covers what it can do and how to revoke a leaked key.
# AUTOMOD_ENABLED = "true"
# Saturday Fools (optional, OFF by default): one silly, purely cosmetic gag
# on each visitor's local Saturday (docs/saturday-fools.md). Exactly "on"
# turns it on; the owner can still force it off from the desk.
# SATURDAY_FOOLS = "on"
# Private analytics. When exactly "true", the forum counts page views as
# AGGREGATE totals only: page type + UTC day + referring site host. It stores
# no IP address, no member id, no user agent, no cookie and no per-visit row;
# requests with DNT: 1 or Sec-GPC: 1, bots and HEAD requests are never
# counted; totals older than 90 days are deleted. Staff see them on the
# desk's Visits page. Any other value (or leaving it out) turns counting off.
ANALYTICS_ENABLED = "false"
# The release this example matches, reported by /api/version. Set it to the
# version you deploy (package.json "version").
VERSION = "5.64.0"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker-first: the worker serves every request (build stamp, security headers).
run_worker_first = true

# Create it first:  pnpm exec wrangler d1 create <database-name>
# then paste the printed database_id here. Wempo Accounts must be configured
# to use this same D1 database. Both Workers must have access to the database
# and use compatible migrations.
[[d1_databases]]
binding = "FORUM_DB"
database_name = "wempo-forum-data"  # CHANGE ME (then run migrations with D1_DATABASE=<name>)
database_id = "00000000-0000-0000-0000-000000000000"  # CHANGE ME
migrations_dir = "migrations"

# OPTIONAL: the search module's full-text index (docs/self-hosting.md §14).
# Leave this block out and the search module simply stays off. To use it:
#   wrangler d1 create <your-search-db-name>
#   wrangler d1 migrations apply <your-search-db-name> --remote
# then turn the module on in the desk and press "Build the search index".
# [[d1_databases]]
# binding = "SEARCH_DB"
# database_name = "wempo-forum-search"  # CHANGE ME
# database_id = "00000000-0000-0000-0000-000000000000"  # CHANGE ME
# migrations_dir = "migrations-search"

# OPTIONAL: Workers AI for the wemposclaude module (docs/modules.md), the
# helper bot that answers when a member tags it. The module ships off and
# stays off without this binding; once it is configured, turn the module on
# in the desk. Workers AI usage is subject to Cloudflare's current pricing,
# account limits and availability:
# https://developers.cloudflare.com/workers-ai/platform/pricing/
[ai]
binding = "AI"

# Rate limits (always on). Each namespace_id must be unique within your
# Cloudflare account. Keep these IDs stable after deployment: changing them
# creates new rate-limit namespaces and resets their accumulated counters.
[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "614202610141001"
[ratelimits.simple]
limit = 180
period = 60

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "614202610141002"
[ratelimits.simple]
limit = 45
period = 60

[[ratelimits]]
name = "GUEST_SESSION_RATE_LIMITER"
namespace_id = "614202610141003"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "REGISTER_RATE_LIMITER"
namespace_id = "614202610141004"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "614202610141005"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "SETUP_RATE_LIMITER"
namespace_id = "614202610141006"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "POST_WRITE_RATE_LIMITER"
namespace_id = "614202610141007"
[ratelimits.simple]
limit = 20
period = 60

[[ratelimits]]
name = "PASSWORD_CHANGE_RATE_LIMITER"
namespace_id = "614202610141008"
[ratelimits.simple]
limit = 6
period = 60

[[ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "614202610141009"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "AVATAR_UPLOAD_RATE_LIMITER"
namespace_id = "614202610141010"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "REACTION_RATE_LIMITER"
namespace_id = "614202610141011"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "IMAGE_UPLOAD_RATE_LIMITER"
namespace_id = "614202610141012"
[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "TOTP_RATE_LIMITER"
namespace_id = "614202610141013"
[ratelimits.simple]
limit = 10
period = 60

# Wempo Accounts sign-in handshake: POST /api/auth/sso/redeem trades the
# Accounts one-time ?wt= code for a forum session over this service binding.
# Deploy Wempo Accounts first in the same Cloudflare account, configure both
# Workers to use the same D1 database, then set `service` to the exact
# deployed Accounts Worker name.
[[services]]
binding = "ACCOUNTS_WORKER"
service = "accounts"  # CHANGE ME to your Wempo Accounts worker name
