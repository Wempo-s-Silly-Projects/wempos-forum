name = "wempos-forum"
main = "worker.mjs"
compatibility_date = "2026-10-13"
workers_dev = true

[vars]
TURNSTILE_HOSTNAMES = "wempos-forum.itswempo.workers.dev"
VERSION = "3.0.0"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "FORUM_DB"
database_name = "wempo-forum-data"
database_id = "e648d306-2c2b-4ddc-aaf1-cef2e023a88c"
migrations_dir = "migrations"


[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "614202610141001"
[ratelimits.simple]
limit = 180
period = 60

